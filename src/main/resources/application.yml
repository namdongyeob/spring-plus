jwt:
  secret:
    key: ${JWT_SECRET_KEY}

spring:
  application:
    name: spring-plus
  datasource:
    url: jdbc:mysql://localhost:3306/spring_plus
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
