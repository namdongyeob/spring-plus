jwt:
  secret:
    key: ${JWT_SECRET_KEY}

spring:
  application:
    name: spring-plus
  datasource:
    url: jdbc:h2:mem:spring-plus
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
